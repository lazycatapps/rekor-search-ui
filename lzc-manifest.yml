# app 的唯一 id,上架到商店需要保证不要冲突,尽量使用开发者自己的域名作为后缀.
package: cloud.lazycat.app.liu.rekorsearch
# app 的版本
version: 0.0.1

name: Rekor Search UI
keyword: rekor, sigstore, transparency log, search
description: Rekor 透明日志搜索工具，提供友好的 Web UI 界面

# 软件名称,会显示在启动器之类的地方
locales:
  zh:
    name: Rekor 搜索
    description: |
      ## Rekor Search UI - Rekor 透明日志搜索工具

      为 Sigstore Rekor 透明日志提供友好的 Web UI 搜索界面。

      ## 主要功能

      - 🔍 简洁易用的搜索界面
      - 📊 实时搜索结果展示
      - 🎯 支持多种搜索条件
      - 📱 响应式设计，支持移动端访问

      ## 数据源说明

      - 默认查询地址为公网的 https://rekor.sigstore.dev
      - 在懒猫微服上默认替换为 https://rekor.${LAZYCAT_BOX_NAME}.heiyu.space（从平台上的 Rekor 查询数据）
      - 如果本地还未部署 Rekor，可以使用默认的公网地址查询数据

  en:
    name: Rekor Search UI
    description: |
      ## Rekor Search UI - Transparency Log Search Tool

      Provides a user-friendly Web UI for searching Sigstore Rekor transparency logs.

      ## Key Features

      - 🔍 Clean and easy-to-use search interface
      - 📊 Real-time search results display
      - 🎯 Multiple search criteria support
      - 📱 Responsive design with mobile support

      ## Data Source

      - Default query address is the public https://rekor.sigstore.dev
      - On LazyCAT Cloud Platform, it defaults to https://rekor.${LAZYCAT_BOX_NAME}.heiyu.space (queries data from the platform's Rekor instance)
      - If you haven't deployed Rekor locally yet, you can use the default public address to query data

# 软件本身的 license
license: https://github.com/lazycatapps/rekor-search-ui/blob/main/LICENSE

# 软件的主页,会在商店等地方体现
homepage: https://github.com/lazycatapps/rekor-search-ui

# lpk 的作者,会在商店等地方体现
author: liu

# application 作为一个特殊的 container 运行，对应的 service 名称为固定的`app`， 其他 service 可以通过此名称与 app 进行通讯
application:
  #是否存在后台任务， 若存在则系统不会对此 app 进行主动休眠等操作
  background_task: false

  # 期望的 app 域名，如果系统中已经有对应域名则会提示用户选择其他域名。 最终 app 分配到的域名以/lzcapp/run/app.subdomain 为准
  subdomain: rekorsearch

  routes:
    - /=file:///lzcapp/var/content/web

  # workdir: /lzcapp/var/content

  # 是否启用多实例
  multi_instance: false

services:
  init:
    image: registry.lazycat.cloud/liu/library/alpine:78039f43fc4b761b

    environment:
      # Set default Rekor domain to a custom domain based on LAZYCAT_BOX_NAME environment variable
      - NEXT_PUBLIC_REKOR_DEFAULT_DOMAIN=https://rekor.${LAZYCAT_BOX_NAME}.heiyu.space

    # Generate runtime config before app starts
    setup_script: |

      rm -rf /content/*
      cp -rf /lzcapp/pkg/content/* /content/

      cat > /content/web/config.js << EOF
      // Runtime configuration generated by setup script
      // Polyfill process.env for runtime configuration
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        window.process.env.NEXT_PUBLIC_REKOR_DEFAULT_DOMAIN = '${NEXT_PUBLIC_REKOR_DEFAULT_DOMAIN:-https://rekor.sigstore.dev}';
      }

      console.warn('Runtime config.js loaded:', window.process.env);
      console.log('The default Rekor domain is https://rekor.sigstore.dev, you can change it in the settings.');
      EOF
      echo "Runtime config generated successfully!"
      cat /content/web/config.js

      # Sleep indefinitely to keep the container running
      sleep infinity

    binds:
      - /lzcapp/var/content:/content
